[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptokit"
version = "2.0.0"
description = "Modern Cryptographic Suite & Classical 3-Stage Key-Schedule Cipher Studio"
authors = [{ name = "Ketan", email = "ketanpalankar123@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=42.0.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
cryptokit = "cryptokit.cli:main"
